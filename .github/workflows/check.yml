name: Kontroll

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run validate:html

  # Spelar ett helt parti med fyra telefoner i Chromium och kontrollerar
  # varje meddelande som värden skickar (e2e/lackkontroll.e2e.js).
  leak-check:
    name: Läckkontroll i webbläsaren
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lackkontroll
          path: test-results
          retention-days: 7
